
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTour Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #eef5ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: min(360px, 90%);
            box-shadow: 0 4px 20px #0002;
        }
        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 6px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #174c35;
            color: white;
            border: 0;
            cursor: pointer;
        }
        .error { color: #c33; }
    </style>
</head>
<body>
    <div class="login">
        <h2>SmartTour Admin</h2>
        <p>Manage local business registrations.</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('business_admin_login') }}">
            <input type="password" name="password"
                   placeholder="Enter admin password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
